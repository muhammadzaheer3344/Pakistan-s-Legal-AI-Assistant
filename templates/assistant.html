{% extends "base.html" %}

{% block title %}Legal Assistant{% endblock %}

{% block content %}
<section class="assistant-form-section">
    <div class="container">
        <h1>Legal Assistant</h1>
        <p class="subtitle">Describe your legal issue and select your preferred language.</p>

        <form action="{{ url_for('ask') }}" method="POST" class="assistant-form">
            <div class="form-group">
                <label for="language">Language</label>
                <select id="language" name="language" required>
                    <option value="en" {% if language=='en' %}selected{% endif %}>English</option>
                    <option value="ur" {% if language=='ur' %}selected{% endif %}>اردو</option>
                </select>
            </div>
            <div class="form-group">
                <label for="question">Your legal issue</label>
                <textarea id="question" name="question" rows="6"
                    placeholder="Describe your legal issue in your own words..." required>{{ query }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary">Get Legal Information</button>
        </form>
    </div>
</section>
{% endblock %}
